services:
  - type: worker
    name: cyber-velva-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SHOP_LINK
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
